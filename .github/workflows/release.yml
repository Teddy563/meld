name: Build Meld 2

# On the meld-2.0 branch this file builds Meld 2 (the Rust workspace in meld2/): the
# `meld2` CLI and the Meld desktop app (Tauri) for Windows, Linux x86_64 and macOS
# (universal), attached to the GitHub release of the tag.
#
# Which workflow a tag runs is decided by the file AT THE TAGGED COMMIT. A `v2.*` tag on
# a meld-2.0 commit runs this file; a Meld 1 tag (`v1.*`, `meld-v*`) on a main commit runs
# main's Python workflow, which this branch does not touch. This file only answers `v2.*`,
# so a stray v1 tag on a meld-2.0 commit builds nothing rather than the wrong app.
#
# Unsigned, like Meld 1's releases: Windows shows a SmartScreen prompt on first run
# ("More info" -> "Run anyway"), macOS Gatekeeper needs "Open Anyway" until the app is
# notarised (a paid Apple Developer account). Arnis is not bundled: the app and the CLI
# download the pinned Arnis release on first use and check its SHA-256 (meld2/core/src/install.rs).

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # The tag, the workspace version and the release notes file must agree, or the assets
  # and the app's own version would disagree with what users think they downloaded.
  version-guard:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, meld2/Cargo.toml and release notes must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws=$(grep -m1 '^version = ' meld2/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag workspace=$ws"
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag but meld2/Cargo.toml says $ws"
            exit 1
          fi
          if [ ! -f "meld2/docs/RELEASE-$ws.md" ]; then
            echo "::error::meld2/docs/RELEASE-$ws.md is missing; it is the release body"
            exit 1
          fi

  test:
    needs: [version-guard]
    # version-guard is skipped on workflow_dispatch; a skipped dependency would skip this too.
    if: always() && (needs.version-guard.result == 'success' || needs.version-guard.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meld2
      - name: Gates
        working-directory: meld2
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            tag: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          # One universal build for Intel and Apple silicon, like the pinned Arnis asset.
          - os: macos-latest
            tag: macos-universal
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meld2
          key: ${{ matrix.tag }}
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version = ' meld2/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: CLI
        working-directory: meld2
        run: |
          mkdir -p ../dist
          name="meld2-${{ steps.v.outputs.version }}-${{ matrix.tag }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --release -p meld2 --target aarch64-apple-darwin
            cargo build --release -p meld2 --target x86_64-apple-darwin
            lipo -create -output meld2 target/aarch64-apple-darwin/release/meld2 target/x86_64-apple-darwin/release/meld2
          else
            cargo build --release -p meld2 --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/meld2$([ "${{ runner.os }}" = "Windows" ] && echo .exe) .
          fi
          # Smoke test on a machine that is not the developer's: it starts, and it finds no
          # Arnis without downloading one.
          export MELD2_HOME="$RUNNER_TEMP/meld2-home"
          ./meld2* --version
          ./meld2* arnis status
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../dist/$name.zip" meld2.exe
          else
            tar czf "../dist/$name.tar.gz" meld2
          fi

      - name: Desktop app
        working-directory: meld2/gui
        run: |
          npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          b=../target/${{ matrix.target }}/release/bundle
          v=${{ steps.v.outputs.version }}
          shopt -s nullglob
          for f in $b/nsis/*.exe; do cp "$f" "../../dist/Meld-$v-windows-x86_64-setup.exe"; done
          # The plain app exe, no installer needed (WebView2 ships with Windows 10/11).
          for f in ../target/${{ matrix.target }}/release/meld-gui.exe; do cp "$f" "../../dist/Meld-$v-windows-x86_64.exe"; done
          for f in $b/deb/*.deb; do cp "$f" "../../dist/Meld-$v-linux-x86_64.deb"; done
          for f in $b/appimage/*.AppImage; do cp "$f" "../../dist/Meld-$v-linux-x86_64.AppImage"; done
          for f in $b/dmg/*.dmg; do cp "$f" "../../dist/Meld-$v-macos-universal.dmg"; done
          ls -la ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Meld-${{ matrix.tag }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever built: one dead runner must not cost the other platforms' assets.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes
        id: notes
        run: echo "file=meld2/docs/RELEASE-${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: artifacts/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.file }}
