name: Build Meld

# Produces the four portable archives. Each one is a folder the user extracts and runs - it
# carries its own Python and its own arnis binary, so the target machine needs nothing
# installed. There is no installer to build and nothing to uninstall.
#
# Unsigned. On Windows that means a SmartScreen prompt on first run ("More info" -> "Run
# anyway"); on macOS, Gatekeeper refuses outright until the app is notarised, which needs a
# paid Apple Developer account. Both are cost decisions, not build problems - see the Meld
# section of the README.

on:
  push:
    # Both spellings. `meld-v*` is what the earlier releases used; a bare `v*` matches the arnis
    # fork's convention and is what gets tagged now. A tag that matches neither builds nothing at
    # all and does so silently, which is a bad way to find out.
    tags: ["v*", "meld-v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Three files carry this release's version and they are read by different code:
  # packaging/build.py NAMES every asset from CHANGELOG.md's first "## " heading,
  # src/__init__.py is what a running Meld reports about itself, and the tag is what
  # users think they downloaded. v1.9.8 shipped assets named Meld-1.9.7-* because the
  # changelog entry was missing and nothing compared the three - and since the upload
  # step only adds and overwrites, re-running the build left BOTH namings on the
  # release. Cheap check, runs before anything is built.
  version-guard:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, CHANGELOG and __init__ must agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"; tag="${tag#meld-v}"
          changelog=$(grep -m1 '^## ' CHANGELOG.md | sed -E 's/^## +\[?v?([^]) ]+)\]?.*/\1/')
          module=$(grep -m1 '^__version__' src/__init__.py | cut -d'"' -f2)
          echo "tag=$tag changelog=$changelog module=$module"
          if [ "$tag" != "$changelog" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag but CHANGELOG.md's first entry says $changelog - every asset would be named Meld-$changelog-*"
            exit 1
          fi
          if [ "$tag" != "$module" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag but src/__init__.py says $module - the app would misreport its own version"
            exit 1
          fi
          echo "tag, CHANGELOG.md and src/__init__.py all agree on $tag"

  test:
    needs: [version-guard]
    # version-guard is skipped on workflow_dispatch (no tag to check), and a skipped
    # dependency would otherwise skip this job too.
    if: always() && (needs.version-guard.result == 'success' || needs.version-guard.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: win-x64
            archive: zip
          - os: ubuntu-latest
            tag: linux-x64
            archive: tar.gz
          # Both architectures are built because a universal2 binary would need universal Python
          # and universal wheels for every dependency, which Pillow and shapely do not reliably
          # ship.
          #
          # The labels match the arnis fork's release workflow, which builds green on both.
          # macos-13 sat 18 minutes on "Waiting for a runner to pick up this job" and would have
          # queued until the 6-hour timeout: that image is retired, so the label has nothing to
          # answer it. A retired runner label fails by hanging, not by erroring, which is the
          # part that wastes an afternoon.
          - os: macos-15-intel
            tag: mac-x64
            archive: tar.gz
          - os: macos-latest
            tag: mac-arm64
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt -r requirements-build.txt

      - name: Linux tray dependencies
        if: runner.os == 'Linux'
        # pystray's Linux backends are thin wrappers over GTK/AppIndicator. They are needed at
        # BUILD time so PyInstaller can find the modules; at run time the user's desktop has to
        # provide the tray itself, which GNOME no longer does without an extension.
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-ayatanaappindicator3-0.1 libgirepository1.0-dev \
                                  libcairo2-dev python3-gi
          pip install pygobject || echo "pygobject unavailable - Meld falls back to headless"

      - name: Build
        run: python packaging/build.py --archive
        env:
          MELD_ARNIS_REPO: Teddy563/arnis

      - name: Smoke test the frozen build
        shell: bash
        # Proves the packaged app starts on a machine that is not the developer's, and - the
        # part that source tests cannot cover - that nothing tries to write into the read-only
        # PyInstaller payload. A build that only fails on a user's machine is the whole reason
        # this step exists.
        run: |
          export MELD_DATA_DIR="${RUNNER_TEMP}/axl-data"
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/Meld/Meld-console.exe --check
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./dist/Meld.app/Contents/MacOS/Meld-console --check
          else
            ./dist/Meld/Meld-console --check
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Meld-${{ matrix.tag }}
          path: dist/Meld-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever built. `needs: build` alone skips this job entirely when any platform
    # fails, so one dead runner costs every archive rather than its own - which is exactly what
    # happened to the arnis fork's release and cost it four platforms of binaries.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true
      - name: Stable-alias copies
        # Duplicate each versioned archive under a fixed name (Meld-win-x64.zip and friends) so
        # that .../releases/latest/download/Meld-win-x64.zip stays valid forever - the versioned
        # name changes every release, the alias never does. The copies land in artifacts/ so the
        # release step below uploads them the same way as everything else. A platform that failed
        # has no archive here and therefore no alias, which is the right outcome: better a 404
        # than a stale binary from the previous release.
        run: |
          shopt -s nullglob
          for suffix in win-x64.zip mac-arm64.tar.gz mac-x64.tar.gz linux-x64.tar.gz; do
            for src in artifacts/Meld-*-"$suffix"; do
              cp "$src" "artifacts/Meld-$suffix"
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          # A platform that failed simply has no archive here; it must not sink the release.
          fail_on_unmatched_files: false
          files: artifacts/*
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          body: |
            ## Meld

            Portable - extract the folder anywhere and run it. No installer, no Python needed.

            | Download | For |
            |---|---|
            | `Meld-*-win-x64.zip` | Windows 10/11 |
            | `Meld-*-mac-arm64.tar.gz` | Mac (M1 and later) |
            | `Meld-*-mac-x64.tar.gz` | Mac (Intel) |
            | `Meld-*-linux-x64.tar.gz` | Linux |

            **Windows** — `Meld.exe` starts in the tray with no window. Run
            `packaging\Create-Shortcut.ps1` for a desktop icon. First launch shows a SmartScreen
            warning because the build is unsigned: *More info* → *Run anyway*.

            **macOS** — the build is not notarised, so Gatekeeper blocks it: open
            *System Settings → Privacy & Security* and choose *Open Anyway*.

            **Linux** — run `packaging/install-shortcut.sh` for a launcher entry. GNOME has no
            tray without the AppIndicator extension; `./Meld --no-tray` works regardless.
