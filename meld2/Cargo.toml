[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Teddy563/meld"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
