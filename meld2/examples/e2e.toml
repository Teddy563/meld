# Two tiny selections in two One Worlds, built two at a time.
# meld2 run examples/e2e.toml --arnis path/to/arnis-3.4.0-beta.1.exe
format = 1
name = "Meld2 E2E"
output = "saves"

[run]
jobs = 2
cpu_target = 80

[defaults]
scale = 1.0
unit_regions = 1     # one-region pieces, so even a tiny area has several to resume
map_item = false
world_border = true  # Arnis puts the vanilla border around each world

[[selection]]
id = "vaduz"
bbox = [47.1390, 9.5200, 47.1410, 9.5230]
world = "Vaduz"

[[selection]]
id = "schaan"
bbox = [47.1600, 9.5000, 47.1700, 9.5150]
world = "Schaan"
settings = { snow_mode = "off", rocks = true }

# A Leaf server for both worlds: `meld2 server setup examples/e2e.toml --accept-eula`,
# then `meld2 server start examples/e2e.toml`. Vaduz is the main level; Schaan
# comes in through Multiverse-Core.
[server]
format = "blinear"   # the run converts both worlds; Leaf 1.21.11 serves the copies
port = 25565
